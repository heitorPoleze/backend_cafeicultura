tags:
  - name: Pessoas
    description: Cadastro e gestão de clientes, fornecedores, funcionários, diaristas, meeiros, prestadores e endereços

components:
  schemas:
    PessoaMistaInput:
      type: object
      required:
        - tipoPessoa
      properties:
        tipoPessoa:
          type: string
          enum: [fisica, juridica]
          description: Define os campos obrigatórios. Para 'fisica', o campo 'nome' é obrigatório; para 'juridica', o campo 'razaoSocial' é obrigatório. CPF, CNPJ e Inscrição Estadual são opcionais.
        nome:
          type: string
          minLength: 3
          maxLength: 100
          example: João da Silva
        cpf:
          type: string
          nullable: true
          example: "123.456.789-00"
        razaoSocial:
          type: string
          minLength: 3
          maxLength: 100
          example: Agro Café LTDA
        cnpj:
          type: string
          nullable: true
          example: "12.345.678/0001-90"
        inscrEstadual:
          type: string
          nullable: true
          example: "123456789"

    PessoaFisicaInput:
      type: object
      required:
        - tipoPessoa
        - nome
      properties:
        tipoPessoa:
          type: string
          enum: [fisica]
          example: fisica
        nome:
          type: string
          minLength: 3
          maxLength: 100
          example: João da Silva
        cpf:
          type: string
          nullable: true
          description: Opcional. Caso informado, deve ser um CPF válido no formato XXX.XXX.XXX-XX.
          example: "123.456.789-00"

    FuncionarioInput:
      allOf:
        - $ref: '#/components/schemas/PessoaFisicaInput'
        - type: object
          properties:
            ctps:
              type: string
              nullable: true
              example: "1234567-89"
            salario:
              type: number
              format: float
              nullable: true
              description: Opcional no cadastro. Caso informado, deve ser maior que zero.
              example: 2500.00

    DiaristaInput:
      allOf:
        - $ref: '#/components/schemas/PessoaFisicaInput'
        - type: object
          properties:
            valorHora:
              type: number
              format: float
              nullable: true
              description: Opcional no cadastro. Caso informado, deve ser maior ou igual a zero.
              example: 25.50

    IdentificacaoPatchInput:
      type: object
      description: Informe apenas 'nome' (Pessoa Física) OU 'razaoSocial' (Pessoa Jurídica), nunca ambos ou nenhum. Deve conter entre 3 e 100 caracteres e no mínimo 3 letras.
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 100
          example: João da Silva
        razaoSocial:
          type: string
          minLength: 3
          maxLength: 100
          example: Agro Café LTDA

    EnderecoInput:
      type: object
      required:
        - cidade
        - bairro
        - cep
        - uf
        - pais
        - logradouro
      properties:
        cidade:
          type: string
          example: Santa Teresa
        bairro:
          type: string
          example: Centro
        cep:
          type: string
          pattern: '^\d{5}-\d{3}$'
          example: "29650-000"
        uf:
          type: string
          minLength: 2
          maxLength: 2
          example: ES
        pais:
          type: string
          example: Brasil
        logradouro:
          type: string
          example: Estrada Rural, Km 5
        idEndereco:
          type: integer
          nullable: true

    PessoaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 12
        idAdministrador:
          type: integer
          example: 3
        dataCadastro:
          type: string
          format: date-time
        nome:
          type: string
          example: João da Silva
        cpf:
          type: string
          nullable: true
          example: "123.456.789-00"
        razaoSocial:
          type: string
          example: Empresa LTDA
        cnpj:
          type: string
          nullable: true
          example: "12.345.678/0001-90"
        inscrEstadual:
          type: string
          nullable: true
        endereco:
          $ref: '#/components/schemas/EnderecoInput'
        papel:
          type: string
          enum: [cliente, fornecedor, funcionario, diarista, meeiro, prestadordeservico]
          nullable: true
          example: cliente

    FuncionarioResponse:
      allOf:
        - $ref: '#/components/schemas/PessoaResponse'
        - type: object
          properties:
            ctps:
              type: string
              nullable: true
              example: "1234567-89"
            salario:
              type: number
              format: float
              example: 2500.00

    DiaristaResponse:
      allOf:
        - $ref: '#/components/schemas/PessoaResponse'
        - type: object
          properties:
            valorHora:
              type: number
              format: float
              example: 25.50

paths:
  /api/v1/clientes:
    post:
      summary: Cadastra um novo cliente
      tags:
        - Pessoas
      security:
        - ApiKeyAuth: []
          cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PessoaMistaInput'
      responses:
        '201':
          description: Cliente cadastrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Cliente cadastrado com sucesso
        '400':
          description: Erro de validação nos campos.
        '409':
          description: Já existe Cliente com este nome/razão social, ou CPF/CNPJ/Inscrição Estadual já cadastrado.
        '500':
          description: Erro interno do servidor.

    get:
      summary: Busca todos os clientes ligados ao administrador autenticado
      tags:
        - Pessoas
      security:
        - ApiKeyAuth: []
          cookieAuth: []
      responses:
        '200':
          description: Clientes retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/PessoaResponse'
        '403':
          description: Acesso negado; usuário não pode visualizar clientes.
        '500':
          description: Erro ao buscar clientes.

  /api/v1/clientes/{id}:
    get:
      summary: Busca um cliente pelo ID
      tags:
        - Pessoas
      security:
        - ApiKeyAuth: []
          cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do cliente retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PessoaResponse'
        '403':
          description: Acesso negado! Não pode visualizar cliente.
        '404':
          description: Cliente não encontrado.
        '500':
          description: Erro ao buscar cliente.

    delete:
      summary: Exclui um cliente pelo ID
      tags:
        - Pessoas
      security:
        - ApiKeyAuth: []
          cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente excluído com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Cliente excluído com sucesso
        '400':
          description: Cliente possui associações e não pode ser excluído.
        '403':
          description: Acesso negado! Não pode excluir cliente.
        '404':
          description: Cliente não encontrado.
        '500':
          description: Erro ao excluir cliente.

