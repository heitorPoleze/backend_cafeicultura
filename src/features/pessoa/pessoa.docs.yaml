  /api/v1/pessoas/identificacao/{id}:
    patch:
      summary: Atualiza nome ou razão social de uma pessoa
      tags:
        - Pessoas
      security:
        - ApiKeyAuth: []
          cookieAuth: []
      parameters:
        - in: path
