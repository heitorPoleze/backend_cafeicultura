tags:
  - name: Safras
    description: Gerenciamento das safras vinculadas a propriedades

components:
  schemas:
    CriarSafraInput:
      type: object
      required:
        - idPropriedade
        - dataInicio
      properties:
        idPropriedade:
          type: integer
          description: ID da propriedade onde a safra será registrada.
          example: 1
        dataInicio:
          type: string
          format: date-time
          description: Data de início da safra no formato ISO 8601.
          example: 2026-06-23T00:00:00.000Z

    SafraResponse:
      type: object
      properties:
        id:
          type: integer
          example: 5
        idPropriedade:
          type: integer
          example: 1
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
          nullable: true
        ativa:
          type: boolean
          example: true

    EventoSafraResponse:
      type: object
      properties:
        modulo:
          type: string
          example: TRATO_CULTURAL
        dados:
          type: object
          description: Objeto completo do evento retornado pelo módulo correspondente.

paths:
  /api/v1/safras:
    post:
      summary: Cadastra uma nova safra
      tags:
        - Safras
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarSafraInput'
      responses:
        '201':
          description: Safra cadastrada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Safra cadastrada com sucesso
                  dados:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
        '400':
          description: Erro de validação nos campos.
        '403':
          description: Acesso negado; usuário não pode cadastrar safra nesta propriedade.
        '404':
          description: Propriedade da safra não encontrada.
        '422':
          description: "Erro de processamento: duas safras ativas ou data inicial futura."
        '500':
          description: Erro interno inesperado ao cadastrar safra.

  paths:
  /api/v1/safras/propriedade/{id}/safra/{idSafra}/relatorio-financeiro:
    get:
      summary: Relatório Financeiro da Safra
      description: Retorna o custo total da safra, agregando as despesas vinculadas a eventos confirmados e as despesas gerais da fazenda ocorridas estritamente dentro do período de duração da safra (timestamp).
      tags: 
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID da Propriedade rural.
        - in: path
          name: idSafra
          required: true
          schema:
            type: integer
          description: ID da Safra a ser analisada.
      responses:
        '200':
          description: Relatório financeiro gerado com sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - custoTotal
                  - transacoes
                properties:
                  custoTotal:
                    type: number
                    format: float
                    description: Soma de todas as despesas vinculadas e gerais do período.
                    example: 15450.75
                  transacoes:
                    type: array
                    description: Lista encapsulada e ordenada cronologicamente de transações financeiras.
                    items:
                      type: object
                      required:
                        - origem
                        - dados
                      properties:
                        origem: 
                          type: string
                          description: Metadado do relatório indicando a fonte da despesa.
                          example: "EVENTO_CONFIRMADO"
                          enum:
                            - EVENTO_CONFIRMADO
                            - DESPESA_GERAL
                        dados:
                          type: object
                          description: O objeto DTO puro da Despesa gerado pela entidade.
                          properties:
                            id: { type: integer, example: 102 }
                            idEvento: { type: integer, nullable: true }
                            idPropriedade: { type: integer, example: 1 }
                            dataHora: { type: string, format: date-time }
                            valor: { type: number, format: float, example: 1200.50 }
                            formaPagamento: { type: string, example: "PIX" }
                            tipoOperacao: { type: string, example: "DESPESA" }
                            descricao: { type: string, example: "Compra de Fertilizante NPK" }
                            beneficiado: { type: object }
        '400':
          description: Erro de validação nos parâmetros.
        '403':
          description: Acesso negado. O usuário logado não é o proprietário da fazenda.
        '404':
          description: Propriedade, Safra ou Transações não encontradas.

  /api/v1/safras/propriedade/{id}/safra/{idSafra}/eventos:
    get:
      summary: Relatório unificado de eventos da safra
      description: Retorna uma linha do tempo de todos os eventos da safra para a propriedade informada.
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID da propriedade rural.
        - in: path
          name: idSafra
          required: true
          schema:
            type: integer
          description: ID da safra.
      responses:
        '200':
          description: Linha do tempo gerada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoSafraResponse'
        '401':
          description: Acesso negado à propriedade.
        '404':
          description: Propriedade, safra não encontrada ou safra sem eventos.

  /api/v1/safras/propriedade/{id}/safra/{idSafra}/talhao/{idTalhao}/eventos:
    get:
      summary: Relatório de eventos da safra por talhão
      description: Retorna os eventos ocorridos em um talhão específico durante uma safra.
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID da propriedade rural.
        - in: path
          name: idSafra
          required: true
          schema:
            type: integer
          description: ID da safra.
        - in: path
          name: idTalhao
          required: true
          schema:
            type: integer
          description: ID do talhão.
      responses:
        '200':
          description: Linha do tempo filtrada gerada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoSafraResponse'
        '401':
          description: Acesso negado à propriedade.
        '404':
          description: Propriedade, safra ou talhão não encontrado, ou sem eventos.

  /api/v1/safras/{id}:
    get:
      summary: Busca uma safra pelo ID
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico da safra.
      responses:
        '200':
          description: Dados da safra retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafraResponse'
        '400':
          description: ID da safra inválido.
        '403':
          description: Acesso negado ou propriedade da safra não encontrada.
        '404':
          description: Safra não encontrada.
        '500':
          description: Erro interno inesperado ao buscar safra.

    delete:
      summary: Exclui uma safra se não houver atividades vinculadas
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico da safra.
      responses:
        '200':
          description: Safra excluída com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Safra excluida com sucesso!
        '400':
          description: ID da safra inválido.
        '403':
          description: Acesso negado ou não é possível excluir safra com atividades vinculadas.
        '404':
          description: Safra ou propriedade não encontrados.
        '500':
          description: Erro interno inesperado ao excluir safra.

  /api/v1/safras/{id}/finalizar:
    patch:
      summary: Finaliza uma safra
      description: Atualiza a data de fim de uma safra e altera seu status para finalizada.
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico da safra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataFim
              properties:
                dataFim:
                  type: string
                  format: date-time
                  example: 2026-12-16T00:00:00.000Z
      responses:
        '200':
          description: Safra finalizada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Safra finalizada com sucesso
        '400':
          description: Erro de validação da data.
        '403':
          description: Acesso negado ou propriedade da safra não encontrada.
        '404':
          description: Safra não encontrada.
        '422':
          description: Erro de processamento (data fim anterior à data de início ou superior ao dia atual).
        '500':
          description: Erro interno inesperado ao finalizar safra.

  /api/v1/safras/propriedade/{idPropriedade}:
    get:
      summary: Lista as safras ativas de uma propriedade
      tags:
        - Safras
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: idPropriedade
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Safras ativas retornadas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafraResponse'
        '403':
          description: Acesso negado; usuário não pode consultar esta propriedade.
        '404':
          description: Propriedade não encontrada.
        '500':
          description: Erro interno inesperado ao buscar safras.
