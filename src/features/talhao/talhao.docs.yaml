tags:
  - name: Talhões
    description: Gerenciamento dos talhões vinculados a propriedades

components:
  schemas:
    TamanhoTalhaoInput:
      type: object
      required:
        - valor
        - medida
      properties:
        valor:
          type: number
          format: float
          description: Deve ser maior que zero.
          example: 5.5
        medida:
          type: string
          enum: [m2, hectare]
          example: hectare

    CadastrarTalhaoInput:
      type: object
      required:
        - nome
        - idPropriedade
        - qtdPeCafe
        - dataInicio
        - tamanho
        - especie
        - variedadesIds
      properties:
        nome:
          type: string
          example: Talhão da Represa
        idPropriedade:
          type: integer
          description: ID numérico da propriedade vinculada.
          example: 1
        qtdPeCafe:
          type: integer
          minimum: 0
          description: Quantidade total de pés de café plantados.
          example: 15000
        dataInicio:
          type: string
          format: date-time
          description: Data de início do plantio/registro no formato ISO 8601.
          example: 2026-01-15T00:00:00.000Z
        tamanho:
          $ref: '#/components/schemas/TamanhoTalhaoInput'
        especie:
          type: string
          enum: [Conilon, Arábica]
          example: Conilon
        variedadesIds:
          type: array
          items:
            type: integer
          minItems: 1
          description: Lista de IDs das variedades plantadas neste talhão.
          example: [1, 3, 5]

    VariedadeResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Catuaí

    TalhaoResumo:
      type: object
      properties:
        id:
          type: integer
          example: 10
        nome:
          type: string
          example: Talhão da Represa
        idPropriedade:
          type: integer
          example: 2
        qtdPeCafe:
          type: integer
          example: 15000
        especie:
          type: string
          example: Conilon
        dataInicio:
          type: string
          format: date-time
          example: 2026-01-15T00:00:00.000Z
        dataFim:
          type: string
          format: date-time
          nullable: true
          example: null
        arquivado:
          type: boolean
          example: false
        tamanho:
          $ref: '#/components/schemas/TamanhoTalhaoInput'

paths:
  /api/v1/talhoes:
    post:
      summary: Cadastra um novo talhão
      tags:
        - Talhões
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarTalhaoInput'
      responses:
        '201':
          description: Talhão cadastrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Talhão cadastrado com sucesso
                  dados:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 10
        '400':
          description: Erro de validação ou regra de negócio.
        '401':
          description: Acesso negado ao cadastrar talhão nesta propriedade.
        '404':
          description: Propriedade não encontrada.
        '500':
          description: Erro interno ao cadastrar talhão.

  /api/v1/talhoes/variedades:
    get:
      summary: Lista as variedades disponíveis no sistema
      tags:
        - Talhões
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de variedades retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariedadeResponse'
        '500':
          description: Erro interno ao buscar variedades.

  /api/v1/talhoes/{id}/encerrar:
    patch:
      summary: Encerra um talhão
      description: Define a data de fim do talhão e marca o registro como encerrado.
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do talhão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataFim
              properties:
                dataFim:
                  type: string
                  format: date-time
                  example: 2026-12-16T00:00:00.000Z
      responses:
        '200':
          description: Talhão encerrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Talhão encerrado com sucesso
        '400':
          description: Erro de validação da data ou erro de regra de negócio.
        '401':
          description: Acesso negado; usuário não pode encerrar o talhão.
        '403':
          description: Propriedade do talhão não encontrada.
        '404':
          description: Talhão não encontrado.
        '500':
          description: Erro interno ao encerrar talhão.

  /api/v1/talhoes/{id}:
    delete:
      summary: Exclui logicamente um talhão
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do talhão.
      responses:
        '200':
          description: Talhão excluído com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Talhão excluído com sucesso
        '400':
          description: Erro de validação ou restrição de negócio.
        '401':
          description: Acesso negado; usuário não pode excluir o talhão.
        '403':
          description: Propriedade do talhão não encontrada.
        '404':
          description: Talhão não encontrado.
        '500':
          description: Erro interno ao excluir talhão.

  /api/v1/talhoes/propriedade/ativos/{idPropriedade}:
    get:
      summary: Lista os talhões ativos de uma propriedade
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: idPropriedade
          required: true
          schema:
            type: integer
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Talhões ativos retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talhoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/TalhaoResumo'
                  pagina:
                    type: integer
                  limite:
                    type: integer
        '400':
          description: ID de propriedade inválido.
        '500':
          description: Erro interno ao buscar talhões ativos.

  /api/v1/talhoes/propriedade/todos/{idPropriedade}:
    get:
      summary: Lista todos os talhões de uma propriedade
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: idPropriedade
          required: true
          schema:
            type: integer
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Talhões retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talhoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/TalhaoResumo'
                  pagina:
                    type: integer
                  limite:
                    type: integer
        '400':
          description: ID de propriedade inválido.
        '500':
          description: Erro interno ao buscar talhões.

  /api/v1/talhoes/propriedade/desativados/{idPropriedade}:
    get:
      summary: Lista os talhões desativados de uma propriedade
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: idPropriedade
          required: true
          schema:
            type: integer
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Talhões desativados retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talhoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/TalhaoResumo'
                  pagina:
                    type: integer
                  limite:
                    type: integer
        '400':
          description: ID de propriedade inválido.
        '500':
          description: Erro interno ao buscar talhões desativados.

  /api/v1/talhoes/propriedade/finalizados/{idPropriedade}:
    get:
      summary: Lista os talhões finalizados de uma propriedade
      tags:
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: idPropriedade
          required: true
          schema:
            type: integer
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Talhões finalizados retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  talhoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/TalhaoResumo'
                  pagina:
                    type: integer
                  limite:
                    type: integer
        '400':
          description: ID de propriedade inválido.
        '500':
          description: Erro interno ao buscar talhões finalizados.
