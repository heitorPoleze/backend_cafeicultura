tags:
  - name: Talhões
    description: Gerenciamento dos talhões vinculados a uma propriedade

components:
  schemas:
    TamanhoTalhaoInput:
      type: object
      required:
        - valor
        - medida
      properties:
        valor:
          type: number
          format: float
          description: Deve ser maior que zero.
          example: 5.5
        medida:
          type: string
          enum: [m2, hectare]
          example: "hectare"

    CadastrarTalhaoInput:
      type: object
      required:
        - nome
        - idPropriedade
        - qtdPeCafe
        - dataInicio
        - tamanho
        - especie
        - variedadesIds
      properties:
        nome:
          type: string
          example: "Talhão da Represa"
        idPropriedade:
          type: integer
          description: ID numérico da propriedade vinculada.
          example: 1
        qtdPeCafe:
          type: integer
          minimum: 0
          description: Quantidade total de pés de café plantados.
          example: 15000
        dataInicio:
          type: string
          format: date-time
          description: Data de início do plantio/registro no formato ISO 8601.
          example: "2026-01-15T00:00:00.000Z"
        tamanho:
          $ref: '#/components/schemas/TamanhoTalhaoInput'
        especie:
          type: string
          enum: [conilon, arabica]
          example: "conilon"
        variedadesIds:
          type: array
          items:
            type: integer
          minItems: 1
          description: Lista de IDs das variedades plantadas neste talhão.
          example: [1, 3, 5]

paths:
  /api/v1/talhoes:
    post:
      summary: Cadastra um novo Talhão
      tags: 
        - Talhões
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarTalhaoInput'
      responses:
        '201':
          description: Talhão cadastrado com sucesso
        '400':
          description: Erro de validação nos campos (ex. tamanho zero, espécie inválida) ou erro de regra de negócio lançado pelo serviço
        '401':
          description: Acesso negado! O usuário não tem permissão para cadastrar nesta propriedade.
        '404':
          description: Propriedade não encontrada
        '500':
          description: Erro interno ao cadastrar talhão

  /api/v1/talhoes/variedades:
    get:
      summary: Busca todas as variedades do sistema
      tags: 
        - Talhões
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de todas as variedades cadastradas
        '500':
          description: Erro interno ao buscar variedades

  /api/v1/talhoes/{id}/encerrar:
    patch:
      summary: Encerra as atividades de um Talhão
      description: Define a data de fim do talhão, desativando-o no sistema.
      tags: 
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico do talhão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataFim
              properties:
                dataFim:
                  type: string
                  format: date-time
                  description: Data de encerramento no formato ISO 8601.
                  example: "2026-12-16T00:00:00.000Z"
      responses:
        '200':
          description: Talhão encerrado com sucesso
        '400':
          description: Erro de validação da dataFim ou erro de regra de negócio
        '401':
          description: Acesso negado! Não foi possível encerrar talhão
        '403':
          description: Propriedade do talhão não encontrada ou sem permissão
        '404':
          description: Talhão não encontrado
        '500':
          description: Erro interno ao encerrar talhão

  /api/v1/talhoes/{id}:
    delete:
      summary: Exclui logicamente ou arquiva um Talhão
      tags: 
        - Talhões
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico do talhão
      responses:
        '200':
          description: Talhão excluído com sucesso
        '400':
          description: Erro de validação do ID na URL ou restrição de negócio
        '401':
          description: Acesso negado! Não foi possível excluir talhão
        '403':
          description: Propriedade do talhão não encontrada ou sem permissão
        '404':
          description: Talhão não encontrado
        '500':
          description: Erro interno ao excluir talhão