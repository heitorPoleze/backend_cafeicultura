tags:
  - name: Insumos
    description: Gerenciamento do catálogo de insumos agrícolas (fertilizantes, defensivos, sementes, etc.).

paths:
  /api/v1/insumos:
    get:
      summary: Lista todos os Insumos
      description: Retorna o catálogo completo de insumos cadastrados, ordenados alfabeticamente.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: idPropriedade
          required: true
          schema:
            type: integer
          description: ID numérico da propriedade.
      responses:
        '200':
          description: Lista de insumos retornada com sucesso.
        '400':
          description: Parâmetro de busca não fornecido.
        '404':
          description: Nenhum insumo encontrado ou estoque de algum insumo não encontrado.
        '500':
          description: Erro interno ao listar insumos.

  /api/v1/insumos/{id}:
    get:
      summary: Busca um Insumo por ID
      description: Retorna os dados de um insumo específico baseado no seu ID.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico do insumo.
        - in: query
          name: idPropriedade
          required: true
          schema:
            type: integer
          description: ID numérico da propriedade.
      responses:
        '200':
          description: Insumo retornado com sucesso.
        '400':
          description: ID inválido fornecido.
        '404':
          description: Insumo ou estoque do insumo não encontrado.
        '500':
          description: Erro interno ao buscar o insumo.

  /api/v1/insumos/buscar:
    get:
      summary: Busca um Insumo por Descrição
      description: Realiza uma busca case-insensitive por um insumo que contenha a descrição informada.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: descricao
          required: true
          schema:
            type: string
          description: Descrição do insumo a ser buscado.
        - in: query
          name: idPropriedade
          required: true
          schema:
            type: integer
          description: ID numérico da propriedade.
      responses:
        '200':
          description: Insumo retornado com sucesso.
        '400':
          description: Parâmetro de busca não fornecido.
        '404':
          description: Nenhum insumo encontrado ou estoque do insumo não encontrado.
        '500':
          description: Erro interno ao buscar o insumo.