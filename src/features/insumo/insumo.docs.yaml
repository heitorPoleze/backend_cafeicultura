tags:
  - name: Insumos
    description: Gerenciamento do catálogo de insumos agrícolas (fertilizantes, defensivos, sementes, etc.).

components:
  schemas:
    CadastrarInsumoInput:
      type: object
      required:
        - idProprietario
        - descricao
        - medida
      properties:
        idProprietario:
          type: integer
          description: ID numérico do proprietário do insumo.
          example: 1
        descricao:
          type: string
          minLength: 3
          description: Nome ou descrição do insumo.
          example: "Ureia Agrícola 46% N"
        medida:
          type: string
          description: Unidade de medida padrão do insumo. Deve corresponder ao Enum (ex. kg, litro, tonelada).
          example: "kg"

paths:
  /api/v1/insumos:
    post:
      summary: Cadastra um novo Insumo
      description: Adiciona um novo item ao catálogo geral de insumos do sistema.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarInsumoInput'
      responses:
        '201':
          description: Insumo cadastrado com sucesso.
        '400':
          description: Erro de sintaxe da requisição.
        '409':
          description: Insumo já cadastrado.
        '422':
          description: Erro de validação dos dados.
        '500':
          description: Erro interno ao cadastrar o insumo.

    get:
      summary: Lista todos os Insumos
      description: Retorna o catálogo completo de insumos cadastrados, ordenados alfabeticamente.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de insumos retornada com sucesso.
        '500':
          description: Erro interno ao listar insumos.

  /api/v1/insumos/{id}:
    get:
      summary: Busca um Insumo por ID
      description: Retorna os dados de um insumo específico baseado no seu ID.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID numérico do insumo.
      responses:
        '200':
          description: Insumo retornado com sucesso.
        '400':
          description: ID inválido fornecido.
        '404':
          description: Insumo não encontrado.
        '500':
          description: Erro interno ao buscar o insumo.

  /api/v1/insumos/buscar/{descricao}:
    get:
      summary: Busca um Insumo por Descrição
      description: Realiza uma busca case-insensitive por um insumo que contenha a descrição informada.
      tags: 
        - Insumos
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: descricao
          required: true
          schema:
            type: string
          description: Texto parcial ou completo da descrição do insumo.
      responses:
        '200':
          description: Insumo retornado com sucesso.
        '400':
          description: Parâmetro de busca não fornecido.
        '404':
          description: Nenhum insumo encontrado com a descrição fornecida.
        '500':
          description: Erro interno ao buscar o insumo.