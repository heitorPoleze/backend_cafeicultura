tags:
  - name: Notificações
    description: Gerenciamento das notificações dos usuários e propriedades.

paths:
  /api/v1/notificacoes:
    get:
      summary: Listar todas as notificações
      description: Retorna todas as notificações vinculadas ao proprietário logado (sessão).
      tags:
        - Notificações
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Lista de notificações retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificacaoResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/notificacoes/nao-lidas:
    get:
      summary: Listar notificações não lidas
      description: Retorna apenas as notificações não lidas vinculadas ao proprietário logado.
      tags:
        - Notificações
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Lista de notificações não lidas retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificacaoResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/notificacoes/propriedades/{id}:
    get:
      summary: Listar notificações por propriedade
      description: Retorna todas as notificações vinculadas a uma propriedade específica pertencente ao usuário logado.
      tags:
        - Notificações
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID da propriedade.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista de notificações da propriedade retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificacaoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/notificacoes/nao-lidas/propriedades/{id}:
    get:
      summary: Listar notificações não lidas por propriedade
      description: Retorna apenas as notificações não lidas vinculadas a uma propriedade específica.
      tags:
        - Notificações
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID da propriedade.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Lista de notificações não lidas da propriedade retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificacaoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/notificacoes/lida:
    patch:
      summary: Marcar notificações como lidas
      description: Atualiza o status das notificações para lida.
      tags:
        - Notificações
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idsNotificacoes
              properties:
                idsNotificacoes:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        "204":
          description: Notificação atualizada com sucesso (No Content).
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    NotificacaoResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID da notificação.
          example: 52
        idEvento:
          type: integer
          description: ID do evento agrícola referenciado.
          example: 18
        idProprietario:
          type: integer
          description: ID do usuário dono da propriedade.
          example: 20
        idPropriedade:
          type: integer
          description: ID da propriedade vinculada à notificação.
          example: 3
        tipoEvento:
          type: string
          description: A categoria da operação agrícola.
          enum:
            - tratosculturais
            - colheitas
            - fermentacoes
            - presecagens
            - secagens
            - pilagens
            - armazenagens
            - vendas
          example: "tratosculturais"
        tipoNotificacao:
          type: string
          description: A janela de tempo da notificação.
          enum:
            - FUTURO_UM
            - FUTURO_DOIS
            - FUTURO_TRES
            - FUTURO_SETE
            - PASSADO
          example: "FUTURO_DOIS"
        dataCriacao:
          type: string
          format: date-time
          example: "2026-08-18T22:57:15.149Z"
        lida:
          type: boolean
          description: Indica se a notificação já foi visualizada pelo usuário.
          example: false

responses:
  ValidationError:
    description: Erro de validação nos parâmetros enviados.
    content:
      application/json:
        schema:
          type: object
          properties:
            erros:
              type: array
              items:
                type: object
                properties:
                  msg:
                    type: string
                    example: "O array idsNotificacoes é obrigatório."
                  param:
                    type: string
                    example: "idsNotificacoes"
                  location:
                    type: string
                    example: "body"

  InternalServerError:
    description: Erro interno no servidor ao processar a requisição.
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: string
              example: "Erro ao atualizar status das notificações."
